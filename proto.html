<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>球帝带 · 交互原型 v1.0.2</title>
<link rel="stylesheet" href="_fonts/outfit.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#3B82F6; --bg:#F6F7F9; --card:#FFFFFF; --text:#101114; --text2:#8A8F99; --text3:#B7BBC3;
  --line:#EFF0F3; --input:#EFF1F5; --red:#FF4D4F; --bubble:#3B82F6; --fs:14px;
  --text-mid:#6E7681;
  --tab-h:58px;
}
body[data-theme="dark"]{
  --bg:#131418; --card:#1C1D22; --text:#F2F3F5; --text2:#8B8F99; --text3:#5A5E68;
  --line:#282A31; --input:#26282F; --card2:#1C1D22;
}
html,body{height:100%}
body{margin:0;font-family:Outfit,"Noto Sans SC","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",Arial,sans-serif;
  background:#EBEEF3;display:flex;align-items:center;justify-content:center;color:var(--text);
  -webkit-font-smoothing:antialiased;transition:background .25s}
body[data-theme="dark"]{background:#07080A}
.wrap{display:flex;gap:40px;align-items:center;justify-content:center}

/* ---------- side meta ---------- */
.meta{width:258px;color:#5A6070;font-size:13px;line-height:1.75}
.meta h1{font-size:18px;color:#141519;margin:10px 0 4px;letter-spacing:-.3px}
.meta .ver{font-size:12px;color:#8A8F99;margin-bottom:10px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:#141519;color:#fff;border-radius:7px;padding:4px 10px;font-size:11px;letter-spacing:.8px;font-weight:500}
.meta p{margin:0 0 10px}
.meta ul{margin:0;padding-left:16px}
.meta li{margin-bottom:4px}
.meta .reset{margin-top:16px;border:1px solid #D5D9E2;background:#fff;border-radius:9px;padding:8px 14px;font-size:12px;color:#3A3F4C;cursor:pointer;font-family:inherit}
.meta .reset:hover{border-color:#141519;color:#141519}

/* ---------- device ---------- */
.device{width:390px;height:844px;background:#0A0A0C;border-radius:52px;padding:9px;
  box-shadow:0 30px 70px -20px rgba(12,16,32,.45),0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 2px #2A2C33;position:relative;flex:0 0 auto}
.screen{width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;color:var(--text);transition:background .25s,color .25s}

/* prototype ribbon */
.protobar{height:22px;background:#141519;color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:9.5px;letter-spacing:1.2px;flex:0 0 auto;opacity:.92}
.protobar b{font-weight:500;letter-spacing:.4px;font-variant-numeric:tabular-nums}

/* status bar */
.statusbar{height:50px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;position:relative}
.sb-l{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.sb-r{display:flex;align-items:center;gap:6px;color:var(--text)}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8.5px}.sig i:nth-child(4){height:11px}
.wifi{width:15px;height:11px;background:currentColor;
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:1px}
.bat{width:23px;height:11.5px;border:1.3px solid currentColor;border-radius:3.5px;position:relative;padding:1.4px}
.bat i{display:block;height:100%;width:72%;background:currentColor;border-radius:1.5px}
.bat::after{content:'';position:absolute;right:-3.4px;top:3px;width:2px;height:4.5px;background:currentColor;border-radius:0 1px 1px 0}
.island{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:100px;height:29px;background:#000;border-radius:16px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:9px}
.cam{width:7px;height:7px;border-radius:50%;background:#1B2230;box-shadow:inset 0 0 0 1.5px #243044}

/* ---------- stack & pages ---------- */
.screen ::-webkit-scrollbar{width:0;height:0}
.stack{flex:1;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.page.enter{animation:slideIn .28s cubic-bezier(.32,.72,0,1)}
.page.leave{animation:slideOut .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:18px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* nav */
.nav{height:46px;flex:0 0 auto;display:flex;align-items:center;padding:0 6px;gap:2px}
.nav .t{flex:1;text-align:center;font-size:18px;font-weight:500;letter-spacing:-.2px}
.nav-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--text);cursor:pointer;border:0;background:transparent;padding:0;-webkit-appearance:none;appearance:none;font-size:14px}
.nav-btn:active{background:rgba(140,150,170,.16)}
.nav-act{color:var(--blue);font-size:14px;font-weight:500;padding:0 10px;min-width:56px;text-align:right;cursor:pointer}
.nav-r{min-width:56px;display:flex;justify-content:flex-end;align-items:center;padding-right:6px}
.nav-r .nav-btn{width:36px;height:36px}
input[type=range]{-webkit-appearance:none;height:3px;background:var(--input);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid #C9CDD6;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.nav-act.dim{color:var(--text3)}
.hbig{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 14px}
.hbig h1{font-size:24px;margin:0;font-weight:500;letter-spacing:-.6px}
.hbig .iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;cursor:pointer;
  border:0;background:transparent;padding:0;color:var(--text);-webkit-appearance:none;appearance:none;font:inherit}

/* search */
.search{display:flex;align-items:center;gap:8px;margin:0 16px 12px;height:44px;background:var(--input);
  border-radius:22px;padding:0 14px;color:var(--text3);flex:0 0 auto}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text);font-family:inherit}
.search input::placeholder{color:var(--text3)}

/* list group */
.group{background:var(--card);margin:10px 12px;border-radius:14px;overflow:hidden}
.group.flush{margin:10px 0;border-radius:0}
.glabel{font-size:13px;color:var(--text-mid);padding:14px 20px 6px;background:transparent}
.row{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;gap:12px;position:relative;cursor:pointer}
.row.noarrow{cursor:default}
.row:active{background:rgba(140,150,170,.09)}
.row+.row::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row .li-l{display:flex;align-items:center;gap:12px;font-size:16px;min-width:0}
.row .ico{width:22px;height:22px;display:grid;place-items:center;color:var(--text);flex:0 0 auto}
.row .li-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .li-r{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);flex:0 0 auto}
.chev{color:var(--text3);font-size:18px;font-weight:300;margin-left:2px;line-height:1}
.val{font-size:14px;color:var(--text2)}
.val.warn{color:var(--text3)}

/* switch */
.sw{width:50px;height:30px;border-radius:15px;background:#E3E5EA;position:relative;transition:background .2s;flex:0 0 auto;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .2s}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(20px)}

/* avatar */
.av{width:50px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:500;font-size:18px;position:relative;flex:0 0 auto;overflow:hidden;text-align:center;line-height:1.1}
.av.round{border-radius:50%}
.av.sm{width:36px;height:36px;border-radius:10px;font-size:14px}
.av.lg{width:58px;height:58px;border-radius:50%;font-size:22px}
.av.xs{width:28px;height:28px;border-radius:8px;font-size:12px}
.av .dot{position:absolute;left:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#22C55E;border:2px solid var(--card);box-sizing:content-box}
.av .tiny{font-size:8.5px;font-weight:500;letter-spacing:-.2px}

/* chat list */
.li{display:flex;gap:14px;padding:12px 16px;align-items:center;cursor:pointer;position:relative}
.li:active{background:rgba(140,150,170,.09)}
.li .mid{flex:1;min-width:0}
.li .nm{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm.gray{color:var(--text-mid)}
.li .pv{font-size:13px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;align-self:flex-start;padding-top:2px}
.li .tm{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.gicon{color:var(--text3);display:grid;place-items:center}

/* tabbar */
.tabbar{height:var(--tab-h);flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:2px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text2);cursor:pointer;position:relative}
.tab.active{color:var(--text);font-weight:500}
.tab.active .tico{color:var(--text)}
.tab .tico{color:var(--text2);opacity:.92}
.tab .bdg{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:9px;
  font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:500}

/* chat page */
.chat-h{display:flex;align-items:center;gap:10px;padding:6px 10px 8px;flex:0 0 auto}
.chat-h .mid{flex:1;min-width:0}
.chat-h .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .sub{font-size:11px;color:var(--text2);margin-top:1px}
.noticebar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:rgba(59,130,246,.08);font-size:12px;color:var(--text2);flex:0 0 auto}
.noticebar .close{margin-left:auto;color:var(--text3);display:grid;place-items:center}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 0 14px;background-attachment:local}

.msg{display:flex;gap:8px;padding:8px 12px;align-items:flex-start;position:relative}
.msg.me{flex-direction:row-reverse}
.msg .bub{max-width:72%;padding:10px 13px;border-radius:16px;background:var(--card);font-size:var(--fs);line-height:1.4;
  word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(16,20,32,.03)}
.msg.me .bub{background:var(--bubble);color:#fff}
.msg .tm{font-size:11px;color:var(--text3);align-self:flex-end;padding-bottom:3px;margin:0 2px}
.msg.picked .box{opacity:1;transform:scale(1)}
.msg .box{width:22px;height:22px;border-radius:50%;border:1.5px solid #C7CBD3;background:var(--card);flex:0 0 auto;align-self:center;
  display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.15s;margin-top:16px}
.msg.picked .box{background:var(--blue);border-color:var(--blue);color:#fff}
.msg .box svg{width:13px;height:13px;opacity:0}
.msg.picked .box svg{opacity:1}
.msg.sel-mode .box{opacity:1;transform:scale(1)}
.msg.sel-mode.me{flex-direction:row}

.poster{width:172px;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#5FE0A8,#22B573 55%,#0E8C57);padding:10px;color:#0B3B26;white-space:normal}
.poster *{white-space:normal}
.bub>div{white-space:normal}
.poster .pt{font-size:18px;font-weight:500;letter-spacing:-.5px;line-height:1.05;color:#0E5C36}
.poster .red{color:#E02B1D}
.poster .prow{display:flex;justify-content:space-between;font-size:8px;border-bottom:1px solid rgba(0,0,0,.15);padding:2.5px 0}
.poster .badge2{display:inline-block;background:#F5D33C;color:#5A3B00;font-size:8px;padding:2px 6px;border-radius:9px;font-weight:500;margin:6px 0 4px}
.poster .ball{float:right;font-size:26px;margin-top:-4px}

.inputbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg)}
.inputbar .ic{width:32px;height:32px;display:grid;place-items:center;color:var(--text);flex:0 0 auto;cursor:pointer}
.inputbar .field{flex:1;height:38px;border-radius:19px;background:var(--input);border:0;outline:none;padding:0 12px;font-size:14px;font-family:inherit;color:var(--text)}
.inputbar .field::placeholder{color:var(--text3)}
.muted-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;margin:8px 12px 12px;
  background:var(--card);border-radius:10px;color:var(--text3);font-size:14px}

.panels{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);display:none}
.panels.show{display:block}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 14px 22px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--text2);cursor:pointer}
.plus-item .sq{width:58px;height:58px;border-radius:14px;background:var(--input);display:grid;place-items:center;color:var(--text)}
.emoji-tabs{display:flex;gap:14px;align-items:center;padding:10px 14px 4px;color:var(--text3);border-bottom:1px solid var(--line)}
.emoji-tabs .e{width:22px;height:22px;display:grid;place-items:center}
.emoji-tabs .e.on{color:var(--text);border-bottom:2px solid var(--blue);padding-bottom:6px;margin-bottom:-5px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px 14px 20px;max-height:190px;overflow-y:auto}
.emoji-grid span{font-size:23px;text-align:center;cursor:pointer;line-height:1.3}
.quote-bar{display:flex;align-items:center;gap:8px;margin:6px 12px 0;padding:8px 10px;background:var(--input);border-radius:8px;font-size:12px;color:var(--text2)}
.quote-bar .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid var(--blue);padding-left:8px}
.quote-bar .x{color:var(--text3);cursor:pointer}

/* ---------- iOS 软键盘 ---------- */
.kbd{flex:0 0 auto;display:none;background:#D1D4DB;padding:7px 3px 10px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.kbd.show{display:block}
.kbd.anim{animation:kbdUp .24s cubic-bezier(.32,.72,0,1) both}
@keyframes kbdUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.kbd-bar{display:flex;align-items:center;padding:0 5px 7px;font-size:16px;color:#101114;height:30px}
.kbd-bar .cand{flex:1;display:flex;justify-content:space-around;align-items:center}
.kbd-bar .cand span{padding:3px 12px;cursor:pointer;border-radius:5px;line-height:1.2}
.kbd-bar .cand span:active{background:rgba(0,0,0,.09)}
.kbd-bar .kico{min-width:40px;height:26px;display:grid;place-items:center;color:#4A4E57;cursor:pointer;font-size:13px}
.krow{display:flex;gap:6px;padding:0 0 7px}
.krow:last-child{padding-bottom:0}
.krow .gap{flex:.5}
.k{flex:1;height:42px;border-radius:5px;background:#FFFFFF;color:#101114;display:grid;place-items:center;
  font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.28);transition:background .06s}
.k:active{background:#BFC4CC}
.k.fn{background:#ADB3BE;font-size:14px}
.k.fn:active{background:#9AA1AD}
.k.wide{flex:1.5}
.k.sp{flex:4.2;font-size:14px}
.k.ret{flex:1.6;background:#ADB3BE;font-size:14px;font-weight:500}
.k.shift-on{box-shadow:inset 0 0 0 1px #7C828C,0 1px 0 rgba(0,0,0,.28)}
body[data-theme="dark"] .kbd{background:#232427}
body[data-theme="dark"] .k{background:#6B6B70;color:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.65)}
body[data-theme="dark"] .k:active{background:#8A8A90}
body[data-theme="dark"] .k.fn,body[data-theme="dark"] .k.ret{background:#3D3D42;color:#FFFFFF}
body[data-theme="dark"] .k.fn:active,body[data-theme="dark"] .k.ret:active{background:#505055}
body[data-theme="dark"] .kbd-bar{color:#E8E9EC}
body[data-theme="dark"] .kbd-bar .kico{color:#B9BBC2}

/* community */
.chans{display:flex;justify-content:center;gap:34px;padding:6px 0 16px}
.chan{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer}
.chan .av{width:62px;height:62px;border-radius:50%;font-size:16px;border:1px solid rgba(140,150,170,.18)}
.signin{display:flex;align-items:center;gap:8px;margin:0 12px 12px;padding:11px 13px;background:var(--card);border-radius:12px;font-size:13px;color:var(--text);cursor:pointer}
.signin .tag{background:#FFF1E6;color:#E2761B;font-size:11px;padding:2px 6px;border-radius:5px;font-weight:500}
.feed{margin:0 12px 12px;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer}
.cover{height:190px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.cover .big{font-size:24px;font-weight:500;line-height:1.1;letter-spacing:-.8px}
.cover .sub2{font-size:11px;opacity:.92;margin-top:6px}
.feed .ft{padding:12px 13px 14px}
.feed .ft .h{font-size:16px;font-weight:500;line-height:1.4}
.feed .ft .meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--text2)}
.art{padding:0 0 20px}
.art .h1{font-size:18px;font-weight:500;line-height:1.4;padding:14px 16px 6px}
.art .am{display:flex;align-items:center;gap:8px;padding:4px 16px 12px;font-size:12px;color:var(--text2)}
.art .am .n{color:var(--text);font-weight:500}
.art .body{padding:0 16px;font-size:14px;line-height:1.85;color:var(--text)}
.art .body p{margin:0 0 14px}
.art .body .em{color:#E02B1D}
.cta{display:block;margin:18px 16px 0;height:50px;border-radius:26px;border:1.5px solid var(--text);background:transparent;
  color:var(--text);font-size:16px;font-weight:500;width:calc(100% - 32px);font-family:inherit;cursor:pointer}
.cta:active{background:rgba(140,150,170,.12)}

/* mine */
.profile-hd{background:linear-gradient(160deg,#1B1C22,#0E0F13);color:#fff;padding:14px 20px 26px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.profile-hd::after{content:'';position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.profile-hd .av{width:58px;height:58px;background:#4A4D57;border-radius:50%;font-size:22px}
.profile-hd .nm{font-size:18px;font-weight:500}
.profile-hd .id{font-size:12px;opacity:.62;margin-top:5px;display:flex;align-items:center;gap:6px}
.profile-hd .qr-btn{position:absolute;right:18px;top:24px;opacity:.85;cursor:pointer}
.sigline{color:rgba(255,255,255,.5);font-size:12px;padding:0 20px 26px;background:linear-gradient(180deg,#121317,#101114);margin-top:-1px}
.sigline span{opacity:.8}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 30px;color:var(--text2);font-size:13px;gap:16px}
.box-ill{width:104px;height:84px;position:relative}
.box-ill .b1{position:absolute;left:10px;bottom:0;width:56px;height:40px;background:#7FA8E8;border-radius:4px;transform:skewY(-4deg)}
.box-ill .b2{position:absolute;right:8px;bottom:0;width:38px;height:34px;background:#C6DAF6;border-radius:4px}
.box-ill .lid{position:absolute;left:8px;top:14px;width:46px;height:12px;background:#5B8DEF;border-radius:3px;transform:rotate(-18deg)}
.box-ill .star{position:absolute;right:12px;top:2px;font-size:14px;color:#F5C542}
.empty .t2{font-size:12px;color:var(--text3)}

/* forms */
.form{padding:8px 16px}
.fieldset{margin-bottom:18px}
.fieldset label{display:block;font-size:14px;font-weight:500;margin-bottom:10px}
.input{width:100%;height:46px;border-radius:10px;background:var(--input);border:0;outline:none;padding:0 13px;font-size:14px;color:var(--text);font-family:inherit}
.input::placeholder{color:var(--text3)}
.hint{font-size:12px;color:var(--text3);margin-top:9px;line-height:1.5}
.btn{height:48px;border-radius:10px;border:0;width:100%;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.dark{background:#141519;color:#fff}
.btn.ghost{background:var(--input);color:var(--text2)}
.btn.disabled{background:var(--input);color:var(--text3)}
.btn.red{color:var(--red);background:transparent}
.btn-row{display:flex;gap:10px;margin-top:auto;padding:16px}

/* appearance */
.preview{margin:12px 16px;border-radius:14px;background:var(--card);padding:12px;position:relative;overflow:hidden}
.pv-bg{position:absolute;inset:0;background-size:cover;opacity:.5}
.pv-inner{position:relative}
.pv-msg{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}
.pv-msg .b{max-width:74%;padding:9px 12px;border-radius:11px;background:var(--bg);font-size:13px;line-height:1.5}
.pv-msg.me{flex-direction:row-reverse}
.pv-msg.me .b{background:var(--bubble);color:#fff}
.pv-input{display:flex;align-items:center;gap:8px;margin-top:4px;padding:7px 10px;border-radius:9px;background:var(--input);color:var(--text3);font-size:12px}
.seg{display:flex;background:var(--input);border-radius:18px;padding:3px;gap:2px}
.seg .s{flex:1;height:33px;border-radius:15px;display:grid;place-items:center;font-size:12px;color:var(--text2);cursor:pointer}
.seg .s.on{background:var(--blue);color:#fff}
.swatches{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px}
.sw-dot{width:36px;height:36px;border-radius:50%;flex:0 0 auto;cursor:pointer;position:relative;border:2px solid transparent;background-clip:padding-box}
.sw-dot.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--blue)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 0}
.bgitem{height:76px;border-radius:10px;border:2px solid transparent;cursor:pointer;background-size:cover;position:relative;overflow:hidden}
.bgitem.on{border-color:var(--blue)}
.bg1{background-image:radial-gradient(circle at 30% 30%,#fff 1px,transparent 1px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 1px);background-color:#F1F3F7;background-size:22px 22px}
.bg2{background-image:radial-gradient(circle at 30% 30%,#fff 1px,transparent 1px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 1px);background-color:#EFF3FA;background-size:16px 16px}
.bg3{background:linear-gradient(140deg,#B08272,#8E6255);position:relative}
.bg3::after{content:'⚽ 🎾 🏀';position:absolute;inset:0;display:grid;place-items:center;font-size:16px;letter-spacing:6px;opacity:.8}

/* storage */
.usage{margin:12px 16px;background:var(--card);border-radius:14px;padding:14px}
.usage .top{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:10px}
.bar{height:7px;border-radius:4px;background:var(--input);display:flex;overflow:hidden}
.bar i{height:100%;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text2);margin-top:10px;flex-wrap:wrap}
.legend b{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.cleans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}
.clean{background:var(--card);border-radius:13px;padding:14px 8px;text-align:center;cursor:pointer}
.clean .n{font-size:13px;font-weight:500;margin-top:8px}
.clean .s{font-size:11px;color:var(--text3);margin-top:3px}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 16px}
.gauge{background:var(--card);border-radius:13px;padding:14px 6px;text-align:center}
.ring{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--blue) 0 40%,var(--input) 40% 100%)}
.ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1;font-size:18px;font-weight:500}
.ring b i{font-size:9px;font-style:normal;font-weight:400;color:var(--text2);margin-left:1px}
.gauge .gl{font-size:11px;color:var(--text2)}
.latency{display:flex;gap:10px;margin:0 16px 12px;background:var(--card);border-radius:13px;padding:14px 12px;align-items:flex-end;justify-content:space-between}
.lat{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.lat svg{width:34px;height:22px}
.lat .v{font-size:11px;color:#22C55E}
.lat .v.bad{color:var(--red)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.line{background:var(--card);border-radius:11px;padding:12px 11px;display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer}
.line.on{box-shadow:inset 0 0 0 1.5px var(--blue)}
.line .ms{font-size:11px;color:#22C55E}

/* devices */
.dev-item{padding:14px 16px;cursor:pointer;position:relative}
.dev-item+.dev-item::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.dev-item .n{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.dev-item .d{font-size:12px;color:var(--text2);margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-all}
.pill{background:#141519;color:#fff;font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500}
body[data-theme="dark"] .pill{background:#3A3D46}
.log{padding:14px 16px;display:flex;gap:12px}
.log .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
.log .n{font-size:14px;font-weight:500}
.log .l{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.7}

/* unlock cards */
.unlocks{display:flex;gap:14px;padding:24px 20px}
.ul{flex:1;cursor:pointer}
.ul .card{height:190px;border-radius:16px;background:linear-gradient(160deg,#1E1F26,#111216);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.ul .card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.06),transparent 60%)}
.ul .lb{text-align:center;font-size:13px;margin-top:12px;color:var(--text)}
.ul .rd{width:19px;height:19px;border-radius:50%;border:1.5px solid #C7CBD3;margin:9px auto 0;display:grid;place-items:center}
.ul.on .rd{background:var(--blue);border-color:var(--blue)}
.ul.on .rd::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}

/* mask */
.mask-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:56px;cursor:pointer}
.mask-row .av{width:38px;height:38px;border-radius:50%}

/* members */
.mem{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.mem .nm{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mem .nm .adm{background:#EAF1FE;color:#2F6FE0;font-size:11px;padding:1.5px 6px;border-radius:4px;font-weight:500}
.mem .nm .ow{background:#FCF0DC;color:#B4771A;font-size:11px;padding:1.5px 6px;border-radius:4px;font-weight:500}
body[data-theme="dark"] .mem .nm .adm{background:#1D2B44}
body[data-theme="dark"] .mem .nm .ow{background:#33280F}

/* qr */
.qr-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 8px}
.qr{width:200px;height:200px;border-radius:12px;background:#fff;padding:8px;display:grid;grid-template-columns:repeat(21,1fr);gap:1px}
.qr i{background:#fff;border-radius:1px}
.qr i.b{background:#4B7FD6}
.qr-acts{display:flex;justify-content:space-around;padding:18px 30px 10px;border-top:1px solid var(--line);margin-top:16px}
.qr-act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--text);cursor:pointer}

/* overlays */
.mask-bg{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:60;display:flex;animation:fade .16s}
.dialog{width:268px;background:var(--card);border-radius:15px;overflow:hidden;margin:auto;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.dialog .dt{font-size:16px;font-weight:500;padding:22px 20px 0}
.dialog .dm{font-size:13px;color:var(--text2);line-height:1.55;padding:10px 22px 20px}
.dialog .da{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dialog .da button{height:49px;border:0;background:transparent;font-size:16px;color:var(--blue);font-family:inherit;cursor:pointer}
.dialog .da button+button{border-top:1px solid var(--line)}
.dialog .da button.cancel{color:var(--text);font-weight:500}
.dialog .da button.danger{color:var(--red)}
.dialog .da.horiz{flex-direction:row}
.dialog .da.horiz button{flex:1}
.dialog .da.horiz button+button{border-top:0;border-left:1px solid var(--line)}

.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:61;animation:slideUp .22s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
.sheet .sg{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet button{display:block;width:100%;height:56px;border:0;background:transparent;font-size:16px;color:var(--text);font-family:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.sheet button:last-child{border-bottom:0}
.sheet button.cancel{font-weight:500;background:var(--card);border-radius:14px;height:54px}
/* 日期滚轮选择器 */
.picker{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:16px 16px 0 0;animation:slideUp .22s cubic-bezier(.32,.72,0,1)}
.picker .ptop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:16px}
.picker .ptop span{cursor:pointer}
.wheels{display:flex;gap:8px;padding:0 16px 24px;position:relative}
.wcol{flex:1;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;scrollbar-width:none;padding:78px 0}
.wcol::-webkit-scrollbar{display:none}
.witem{height:44px;line-height:44px;font-size:18px;scroll-snap-align:center;color:var(--text3);white-space:nowrap;position:relative}
.witem.sel{color:var(--text);font-weight:500}
.wheel-mid{position:absolute;left:16px;right:16px;top:100px;height:44px;transform:translateY(-50%);background:rgba(180,190,208,.32);border-radius:8px;pointer-events:none}
.sheet button .sm{display:block;font-size:11px;color:var(--text3);margin-top:2px}
.sheet .st{font-size:12px;color:var(--text2);text-align:center;padding:12px 0 14px;background:var(--card);border-bottom:1px solid var(--line)}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,22,28,.9);color:#fff;
  font-size:13px;padding:10px 16px;border-radius:10px;z-index:90;max-width:80%;text-align:center;animation:fade .18s}

/* long press menu */
.lmenu{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 12px 36px rgba(10,14,24,.22);
  z-index:70;width:148px;overflow:hidden;animation:pop .14s;padding:2px 0}
.lmenu .mi{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:14px;color:var(--text);cursor:pointer}
.lmenu .mi:active{background:rgba(140,150,170,.12)}
.lmenu .mi svg{color:var(--text2)}

/* popover */
.pop{position:absolute;right:12px;top:96px;width:150px;background:var(--card);border-radius:13px;z-index:65;
  box-shadow:0 14px 40px rgba(10,14,24,.2);overflow:hidden;animation:pop .16s}
.pop .pi{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:14px;cursor:pointer}
.pop .pi:active{background:rgba(140,150,170,.12)}
.pop::before{content:'';position:absolute;right:20px;top:-6px;width:12px;height:12px;background:var(--card);transform:rotate(45deg);border-radius:2px}

/* index bar */
.idx{position:absolute;right:3px;top:150px;bottom:70px;display:flex;flex-direction:column;justify-content:center;gap:0;
  font-size:11px;color:var(--text2);width:16px;text-align:center;z-index:5}
.idx span{line-height:1.45}

.fadein{animation:fade .2s}
@media (max-width:900px){
  .wrap{gap:0}
  .meta{display:none}
  .device{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
}
/* 被 index.html 框架页以 iframe 载入时：视口高度不足则整页可滚动，机身不被裁切 */
html.is-embedded body{align-items:flex-start;overflow-y:auto;padding:18px 0 24px}
html.is-embedded body::-webkit-scrollbar{width:0}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const AVCOL = ['#3B6EF6','#E23A2E','#1E1E22','#C89A3C','#7C5CD6','#22A06B','#D9622B','#2E9AA8'];
function av(name, opt={}){
  const ch = opt.t || (name||'').slice(0,1);
  const bg = opt.c || AVCOL[(name||'x').charCodeAt(0)%AVCOL.length];
  const cls = ['av', opt.round?'round':'', opt.size||''].join(' ');
  const fs = opt.t && opt.t.length>2 ? 'font-size:11px;line-height:1.15' : '';
  return `<div class="${cls}" style="background:${bg};${opt.grad?`background-image:${opt.grad};`:''}${fs}">${opt.html||esc(ch)}${opt.online?'<i class="dot"></i>':''}</div>`;
}
function swRow(label,key,val){ return `<div class="row noarrow"><div class="li-l"><span class="li-t">${label}</span></div>

function row(o){

  return `<div class="row ${o.cls||''}" ${o.go?`data-go="${o.go}"`:''} ${o.params?`data-params='${JSON.stringify(o.params)}'`:''} ${o.act?`data-act="${o.act}"`:''} ${o.msg?`data-m="${o.msg}"`:''}>
    <div class="li-l">${o.icon?`<span class="ico" style="${o.iconColor?`color:${o.iconColor}`:''}">${ic(o.icon,21)}</span>`:''}
      <span class="li-t" style="${o.labelStyle||''}">${o.label}</span></div>
    <div class="li-r">${o.value!==undefined?`<span class="val ${o.valueCls||''}">${o.value}</span>`:''}
      ${o.sw?`<span class="sw ${o.swOn?'on':''}" data-toggle="${o.sw}"></span>`:''}

function applyTheme(){
  let t = S.theme;
  if(t==='auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  document.body.dataset.theme = t;
  document.documentElement.style.setProperty('--bubble', S.theme==='dark'&&S.bubble==='#111111' ? '#4A4D57' : S.bubble);
  document.documentElement.style.setProperty('--fs', S.font+'px');
}

/* ---------- router ---------- */
const stack = [];
function mount(entry, animate){
  const el = document.createElement('div');
  el.className = 'page' + (animate?' enter':'');
  el.dataset.name = entry.name;
  const fn = PAGES[entry.name] || (()=>`<div class="nav"><div class="nav-btn" data-back>${ic('back')}</div><div class="t">页面建设中</div><div class="nav-btn"></div></div><div class="pbody"><div class="empty">该页面在截图中未出现</div></div>`);
  el.innerHTML = fn(entry.params||{});
  stackEl.appendChild(el);
  entry.el = el;
  if(entry.name!=='chat') S.kbd.open = false;
  const ci = el.querySelector('[data-chatinput]'); if(ci){ ci.value = S.draft||''; S.caret = (S.draft||'').length; }
  if(animate) setTimeout(()=>el.classList.remove('enter'), 300);
  const b = el.querySelector('.pbody'); if(b) b.scrollTop = 0;
  if(entry.params && entry.params.scroll) b.scrollTop = entry.params.scroll;
  return el;
}
function root(name, params={}){
  stackEl.innerHTML=''; stack.length=0;
  stack.push({name,params}); mount(stack[0], false);
}
function go(name, params={}){
  const cur = stack[stack.length-1];
  if(cur){ const b = cur.el.querySelector('.pbody'); if(b) cur.params.scroll = b.scrollTop; }
  const e = {name,params}; stack.push(e); mount(e, true);
}
function back(){
  if(stack.length<2){ return; }
  const top = stack.pop();
  top.el.classList.add('leave');
  setTimeout(()=>top.el.remove(), 230);
}
function refresh(){
  const top = stack[stack.length-1]; if(!top) return;
  const body = top.el.querySelector('.pbody');
  const sc = body? body.scrollTop : 0;
  top.el.innerHTML = PAGES[top.name](top.params||{});
  const nb = top.el.querySelector('.pbody'); if(nb) nb.scrollTop = sc;
  const ci = top.el.querySelector('[data-chatinput]'); if(ci){ ci.value = S.draft||''; S.caret = (S.draft||'').length; }
  top.el.classList.remove('enter');
}

/* ---------- overlays ---------- */
function closeOverlay(){ document.querySelectorAll('.mask-bg,.sheet,.lmenu,.pop,.toast').forEach(n=>n.remove()); }
function toast(msg, ms=1600){
  document.querySelectorAll('.toast').forEach(n=>n.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  screenEl.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function dialog(opt){
  closeOverlay();
  const wa = opt.warn ? `<div class="dt">${opt.title}</div>` : `<div class="dt">${opt.title}</div>`;
  const acts = (opt.actions||[{label:'取消',cancel:true}]);
  const wrap = document.createElement('div');
  wrap.className='mask-bg';
  wrap.innerHTML = `<div class="dialog">
    ${wa}
    ${opt.msg?`<div class="dm">${opt.msg}</div>`:''}
    <div class="da">${acts.map((a,i)=>`<button data-i="${i}" class="${a.cancel?'cancel':''} ${a.danger?'danger':''}">${a.label}</button>`).join('')}</div>
  </div>`;
  wrap.addEventListener('click', e=>{
    if(e.target===wrap){ closeOverlay(); return; }
    const b = e.target.closest('button[data-i]'); if(!b) return;
    const a = acts[+b.dataset.i];
    closeOverlay();
    if(a && a.onClick) a.onClick();
    else if(a && a.cancel!==undefined && !a.onClick) {}
  });
  screenEl.appendChild(wrap);
}
function sheet(items, opt={}){
  closeOverlay();
  const wrap = document.createElement('div');
  wrap.className='mask-bg'; wrap.style.alignItems='flex-end';
  wrap.innerHTML = `<div class="sheet">
    ${opt.title?`<div class="sg"><div class="st">${opt.title}</div></div>`:''}
    <div class="sg">${items.map((it,i)=>`<button data-i="${i}">${it.label}${it.sub?`<span class="sm">${it.sub}</span>`:''}</button>`).join('')}</div>
    <button class="cancel" data-cancel>取消</button>
  </div>`;
  wrap.addEventListener('click', e=>{
    if(e.target===wrap || e.target.hasAttribute('data-cancel')){ closeOverlay(); return; }
    const b = e.target.closest('button[data-i]'); if(!b) return;
    const it = items[+b.dataset.i]; closeOverlay();
    if(it && it.onClick) it.onClick();
  });
  screenEl.appendChild(wrap);
}

PAGES.qrcode = () => {
  const cells = [];
  const seed = 20261110;
  for(let i=0;i<441;i++){
    const r = Math.floor(i/21), c = i%21;
    const finder = (r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7);
    let b;
    if(finder){ b = (r%6===0||c%6===0||((r>1&&r<5)&&(c>1&&c<5))||((r>1&&r<5)&&(c>15&&c<19))||((r>15&&r<19)&&(c>1&&c<5))); }
    else b = ((r*c + seed + r*7 + c*13) % 7) < 3;
    cells.push(`<i class="${b?'b':''}"></i>`);
  }
  return `${nav('二维码')}
  <div class="pbody">
    <div class="qr-wrap">
      <div style="display:flex;align-items:center;gap:12px;width:100%;padding:0 34px 16px">
        ${av('F',{c:'#6D9BF5',round:true,size:'sm',html:'F'})}
        <div><div style="font-size:18px;font-weight:500">${S.nick||D.me.name}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:5px">用户ID：${D.me.id}<span data-act="copyid">${ic('copy',13)}</span></div></div>
      </div>
      <div style="position:relative"><div class="qr">${cells.join('')}</div>
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:9px;background:#111;display:grid;place-items:center;color:#fff">${ic('chat',20)}</div></div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:16px;width:100%;padding:0 60px">
        <div><div style="font-size:13px">扫一扫</div><div style="font-size:12px;color:var(--text2);margin-top:3px">加我为好友</div></div>
        <div style="margin-left:auto;width:44px;height:44px;border-radius:10px;background:#111;display:grid;place-items:center;color:#fff">${ic('chat',20)}</div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--text2);margin-top:22px;line-height:1.7">此二维码 50 次有效<br>有效期至 2026-11-10 16:00</div>
      <div style="font-size:12px;color:var(--blue);margin-top:10px" data-act="toast" data-m="二维码已刷新">↻ 点击刷新</div>
    </div>
    <div class="qr-acts">
      <div class="qr-act" data-act="toast" data-m="已打开扫一扫（原型演示）"><span>${ic('scan',24)}</span>扫一扫</div>
      <div class="qr-act" data-act="toast" data-m="已复制分享链接"><span>${ic('share',24)}</span>分享</div>
      <div class="qr-act" data-act="toast" data-m="已保存到相册"><span>${ic('folder',24)}</span>保存图片</div>
    </div>
  </div>`;
};

/* ---------- iOS 软键盘 ---------- */
function kbdHtml(){
  const lay = S.kbd.layer, up = S.kbd.shift;
  const R1 = lay==='abc' ? 'qwertyuiop'.split('') : '1234567890'.split('');
  const R2 = lay==='abc' ? 'asdfghjkl'.split('') : ['-','/',':',';','(',')','¥','&','@','"'];
  const R3 = lay==='abc' ? 'zxcvbnm'.split('') : ['。','，','、','？','！','…'];
  const label = c => (lay==='abc' && up) ? c.toUpperCase() : c;
  const kq = c => String(c).replace(/"/g,'&quot;');
  const k = c => `<div class="k" data-act="kbdkey" data-k="${kq(c)}">${esc(String(label(c)))}</div>`;
  const cands = lay==='abc' ? ['好的','收到','马上到'] : [];
  return `<div class="kbd ${S.kbd.open?'show':''}" id="kbd">
    <div class="kbd-bar">
      <span class="kico" data-act="kbdhide">⌄</span>
      <span class="cand">${cands.map(w=>`<span data-act="kbdword" data-v="${w}">${w}</span>`).join('')}</span>
      <span class="kico">${lay==='abc'?'拼音':'数字'}</span>
    </div>
    <div class="krow">${R1.map(k).join('')}</div>
    <div class="krow"><span class="gap"></span>${R2.map(k).join('')}<span class="gap"></span></div>
    <div class="krow">
      ${lay==='abc'
        ? `<div class="k fn wide ${up?'shift-on':''}" data-act="kbdshift">⇧</div>`
        : `<span class="gap" style="flex:1.5"></span>`}
      ${R3.map(k).join('')}
      <div class="k fn wide" data-act="kbdback">⌫</div>
    </div>
    <div class="krow">
      <div class="k fn" data-act="kbd123" style="flex:1.25">${lay==='abc'?'123':'ABC'}</div>
      <div class="k sp" data-act="kbdspace">空格</div>
      <div class="k ret" data-act="kbdreturn">发送</div>
    </div>
  </div>`;
}

  const col=(arr,unit)=>`<div class="wcol">${arr.map(v=>`<div class="witem">${v}${unit}</div>`).join('')}</div>`;
  wrap.innerHTML=`<div class="picker">

  </div>`;
  const cols=[...wrap.querySelectorAll('.wcol')];
  const IH=44;
  const setSel=(c,forced)=>{
    const idx=forced!=null?forced:Math.min(c.children.length-1, Math.max(0, Math.round(c.scrollTop/IH)));
    [...c.children].forEach((n,i)=>n.classList.toggle('sel',i===idx));

  cols.forEach(c=>c.addEventListener('scroll',()=>setSel(c),{passive:true}));
  wrap.addEventListener('click',e=>{
    if(e.target===wrap||e.target.hasAttribute('data-cancel')){ closeOverlay(); return; }
    if(e.target.hasAttribute('data-ok')){

};

ACT.exitgroup = (el)=> dialog({title:'退出群聊',msg:'退出后将不再接收该群消息，聊天记录会保留在本机。',actions:[{label:'退出群聊',danger:true,onClick:()=>{
  S.chatState[el.dataset.id]='exited'; toast('已退出群聊'); back(); back();
}},{label:'取消',cancel:true}]});
ACT.clearhistory = ()=> dialog({title:'删除聊天记录',msg:'删除后不可恢复，确定删除？',actions:[{label:'删除',danger:true,onClick:()=>{ D.msgs[S.curChat]=[]; toast('聊天记录已删除'); refresh(); }},{label:'取消',cancel:true}]});
ACT.delchat = ()=> dialog({title:'删除',msg:'删除该群聊会话？',actions:[{label:'删除',danger:true,onClick:()=>{ toast('已删除'); back(); back(); }},{label:'取消',cancel:true}]});
ACT.closenotice = (el)=>{ el.closest('.noticebar').style.display='none'; };

/* 面板 */
ACT.panel = (el)=>{
  if(S.kbd.open) kbClose();
  const v = el.dataset.v;
  const plus = document.getElementById('panel-plus');
  const emoji = document.getElementById('panel-emoji');
  const showPlus = plus && !plus.classList.contains('show');
  const showEmoji = emoji && !emoji.classList.contains('show');
  if(plus) plus.classList.remove('show');
  if(emoji) emoji.classList.remove('show');
  if(v==='plus' && showPlus) plus.classList.add('show');
  if(v==='emoji' && showEmoji) emoji.classList.add('show');
  const m = document.getElementById('msgs'); if(m) m.scrollTop = m.scrollHeight;
};
ACT.panelclose = ()=>{ document.querySelectorAll('.panels').forEach(p=>p.classList.remove('show')); };

/* ---------- iOS 软键盘控制 ---------- */
function kbdNode(){ return document.getElementById('kbd'); }
function kbRender(){ const el=kbdNode(); if(el){ el.outerHTML = kbdHtml(); } }
function kbOpen(){
  S.kbd.open = true;
  document.querySelectorAll('.panels').forEach(p=>p.classList.remove('show'));
  const el = kbdNode();
  if(el){
    if(!el.classList.contains('show')){
      el.classList.add('show','anim');
      setTimeout(()=>el.classList.remove('anim'), 260);
    }
  }
  const m = document.getElementById('msgs'); if(m) m.scrollTop = m.scrollHeight;
}
function kbClose(){
  S.kbd.open = false;
  const el = kbdNode(); if(el){ el.classList.remove('show','anim'); }
  const i = screenEl.querySelector('[data-chatinput]'); if(i) i.blur();
}
/* 光标位置：优先用真实 selection（聚焦时），否则用自维护的 S.caret */
function kbCaret(i){
  if(document.activeElement===i && i.selectionStart!=null){ S.caret = i.selectionStart; }
  return (S.caret==null ? i.value.length : Math.min(S.caret, i.value.length));
}
function kbInsert(t){
  const i = screenEl.querySelector('[data-chatinput]'); if(!i) return;
  const s = kbCaret(i);
  i.value = i.value.slice(0,s) + t + i.value.slice(s);
  S.caret = s + t.length;
  try{ i.setSelectionRange(S.caret,S.caret); }catch(_){}
  S.draft = i.value;
}
ACT.kbdkey = (el)=>{
  let c = el.dataset.k;
  if(S.kbd.layer==='abc' && S.kbd.shift) c = c.toUpperCase();
  kbInsert(c);
  if(S.kbd.layer==='abc' && S.kbd.shift){ S.kbd.shift=false; kbRender(); }
};
ACT.kbdshift = ()=>{ S.kbd.shift = !S.kbd.shift; kbRender(); };
ACT.kbd123 = ()=>{ S.kbd.layer = S.kbd.layer==='abc' ? 'num' : 'abc'; S.kbd.shift=false; kbRender(); };
ACT.kbdspace = ()=>{ kbInsert(' '); };
ACT.kbdword = (el)=>{ kbInsert(el.dataset.v); };
ACT.kbdback = ()=>{
  const i = screenEl.querySelector('[data-chatinput]'); if(!i) return;
  const s = kbCaret(i);
  if(s>0){
    i.value = i.value.slice(0,s-1) + i.value.slice(s);
    S.caret = s-1;
    try{ i.setSelectionRange(S.caret,S.caret); }catch(_){}
    S.draft = i.value;
  }
};
ACT.kbdreturn = ()=>{ sendMsg(); };
ACT.kbdhide = ()=>{ kbClose(); };

ACT.emoji = (el)=>{ kbInsert(el.dataset.v); };
ACT.unquote = ()=>{ S.quote=null; refresh(); };
ACT.chatsearch = ()=>{ go('search'); };

/* 发送 */
function sendMsg(){
  const inp = screenEl.querySelector('[data-chatinput]'); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  const id = S.curChat;
  D.msgs[id] = D.msgs[id]||[];
  D.msgs[id].push({me:true, text:v});
  inp.value=''; S.draft=''; S.caret=0;
  refresh();
  const m = document.getElementById('msgs'); if(m) m.scrollTop = m.scrollHeight;
  if(S.kbd.open){
    const ni = screenEl.querySelector('[data-chatinput]');
    if(ni){ try{ ni.focus({preventScroll:true}); }catch(_){ ni.focus(); } }
  }
}

/* 消息菜单 */
function openMsgMenu(msgEl){
  closeOverlay();
  const i = +msgEl.dataset.i;
  const r = msgEl.getBoundingClientRect();
  const sr = screenEl.getBoundingClientRect();
  const menu = document.createElement('div'); menu.className='lmenu';
  menu.innerHTML = `
    <div class="mi" data-a="pin">置顶 ${ic('pin',17)}</div>
    <div class="mi" data-a="quote">引用 ${ic('quote',17)}</div>
    <div class="mi" data-a="fwd">转发 ${ic('share',17)}</div>
    <div class="mi" data-a="multi">多选 ${ic('check',17)}</div>
    <div class="mi" data-a="copy">复制 ${ic('copy',17)}</div>
    <div class="mi" data-a="del">删除 ${ic('trash',17)}</div>`;
  const top = Math.min(Math.max(r.top - sr.top - 40, 96), 470);
  menu.style.top = top+'px'; menu.style.left = '14px';
  menu.addEventListener('click',e=>{
    const it=e.target.closest('.mi'); if(!it) return;
    const a=it.dataset.a; closeOverlay();
    if(a==='pin') toast('已置顶该消息');
    if(a==='quote'){ S.quote=(D.msgs[S.curChat]||[])[i]?.text||'图片'; refresh(); toast('已引用，可在输入框编辑'); }
    if(a==='fwd') go('forward',{});
    if(a==='multi'){ S.multi=true; S.picked=new Set([i]); refresh(); }
    if(a==='copy'){ const t=(D.msgs[S.curChat]||[])[i]?.text||''; navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{}); toast('已复制'); }
    if(a==='del') dialog({title:'删除消息',msg:'删除后不可恢复，确定删除该消息？',actions:[{label:'删除',danger:true,onClick:()=>{ (D.msgs[S.curChat]||[]).splice(i,1); refresh(); toast('已删除'); }},{label:'取消',cancel:true}]});
  });
  screenEl.appendChild(menu);
  setTimeout(()=>{ const off=e=>{ if(!menu.contains(e.target)){ closeOverlay(); document.removeEventListener('pointerdown',off);} }; document.addEventListener('pointerdown',off); }, 60);
}

/* 多选 */
ACT.msgclick = (el)=>{
  const i=+el.dataset.i;
  if(!S.multi){ return; }
  if(S.picked.has(i)) S.picked.delete(i); else S.picked.add(i);
  refresh();
};
ACT.exitmulti = ()=>{ S.multi=false; S.picked.clear(); refresh(); };
ACT.multiforward = ()=>{ if(!S.picked.size){ toast('请先选择消息'); return; } go('forward',{}); };
ACT.multidel = ()=>{ if(!S.picked.size){ toast('请先选择消息'); return; }
  dialog({title:'删除消息',msg:`确定删除已选的 ${S.picked.size} 条消息？`,actions:[{label:'删除',danger:true,onClick:()=>{
    const arr=[...S.picked].sort((a,b)=>b-a); arr.forEach(i=>(D.msgs[S.curChat]||[]).splice(i,1));
    S.multi=false; S.picked.clear(); refresh(); toast('已删除'); }},{label:'取消',cancel:true}]}); };

/* 转发 */
ACT.fwdmulti = ()=>{ S.forwardMulti=true; refresh(); };
ACT.fwdpick = (el)=>{ const id=el.dataset.id;
  if(S.forwardMulti){ if(S.forwardPicked.has(id)) S.forwardPicked.delete(id); else S.forwardPicked.add(id); refresh(); }
  else { doForward(); } };
ACT.fwdto = ()=>{ doForward(); };
ACT.fwdconfirm = ()=>{ if(!S.forwardPicked.size){ toast('请选择转发对象'); return; } doForward(); };
function doForward(){
  S.forwardMulti=false; const n=S.forwardPicked.size||1; S.forwardPicked.clear();
  toast(`已转发给 ${n} 个会话`);
  setTimeout(()=>{ if(stack[stack.length-1].name==='forward'){ back(); S.multi=false; S.picked.clear(); } },500);
}

/* =========================================================
   全局事件
   ========================================================= */
screenEl.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-act],[data-go],[data-back],[data-toggle]');
  if(!t) return;
  if(t.hasAttribute('data-toggle')){
    const k=t.dataset.toggle; t.classList.toggle('on');
    if(k in S.sw) S.sw[k]=t.classList.contains('on');
    if(k==='pure'){ S.pure=t.classList.contains('on'); applyTheme(); }
    return;
  }
  if(t.hasAttribute('data-back')){ back(); return; }
  if(t.hasAttribute('data-go')){
    let params={}; try{ params = t.dataset.params?JSON.parse(t.dataset.params):{}; }catch(_){}
    go(t.dataset.go, params); return;
  }
  if(t.dataset.act){
    const fn = ACT[t.dataset.act];
    if(fn) fn(t);
    return;
  }
});

/* 长按消息 */
let lp=null;
screenEl.addEventListener('pointerdown',(e)=>{
  const b=e.target.closest('.bub'); if(!b) return;
  if(S.multi) return;
  lp = setTimeout(()=>{ const m=b.closest('.msg'); if(m) openMsgMenu(m); }, 460);
});
['pointerup','pointermove','pointercancel'].forEach(ev=>screenEl.addEventListener(ev,()=>{ clearTimeout(lp); }));
screenEl.addEventListener('contextmenu',(e)=>{ const b=e.target.closest('.bub'); if(b){ e.preventDefault(); openMsgMenu(b.closest('.msg')); } });

/* 输入框回车发送 */
screenEl.addEventListener('keydown',(e)=>{
  if(e.key==='Enter' && e.target.matches('[data-chatinput]')){ e.preventDefault(); sendMsg(); }
  if(e.key==='Enter' && e.target.id==='addfid'){ e.preventDefault(); dialog({title:'发送好友申请', msg:`将向用户 ${e.target.value.trim()||'-'} 发送好友申请。`, actions:[{label:'发送',onClick:()=>{toast('好友申请已发送');}},{label:'取消',cancel:true}]}); }
});

/* 软键盘：聚焦输入框弹出，点消息区/其它区域收起 */
screenEl.addEventListener('focusin',(e)=>{
  if(e.target.matches && e.target.matches('[data-chatinput]')) kbOpen();
});
screenEl.addEventListener('input',(e)=>{
  if(e.target.matches && e.target.matches('[data-chatinput]')){
    S.draft = e.target.value;
    S.caret = e.target.selectionStart==null ? e.target.value.length : e.target.selectionStart;
  }
  if(e.target.matches && e.target.matches('[data-signinput]')){
    const c=screenEl.querySelector('[data-signcnt]'); if(c) c.textContent=e.target.value.length+'/50';
  }
});
/* 键盘按键不夺焦点：输入框保持光标与选区 */
screenEl.addEventListener('pointerdown',(e)=>{
  if(e.target.closest('.kbd')) e.preventDefault();
}, true);
/* 真实光标变化时同步 S.caret */
document.addEventListener('selectionchange', ()=>{
  const i = document.activeElement;
  if(i && i.matches && i.matches('[data-chatinput]') && i.selectionStart!=null){ S.caret = i.selectionStart; }
});
screenEl.addEventListener('pointerdown',(e)=>{
  if(!S.kbd.open) return;
  if(e.target.closest('.kbd')) return;
  if(e.target.closest('[data-chatinput]')) return;
  if(e.target.closest('[data-act="panel"]')) return;
  kbClose();
});

/* 字号滑杆实时预览 */
screenEl.addEventListener('input',(e)=>{
  if(e.target.matches('[data-act="fontrange"]')){
    S.font = +e.target.value;
    document.documentElement.style.setProperty('--fs', S.font+'px');
    screenEl.querySelectorAll('.preview .b').forEach(b=>b.style.fontSize=S.font+'px');
    const lb = screenEl.querySelector('.fontpos') || screenEl.querySelector('.pbody div[style*="text-align:center"]');
    if(lb && /标准|较小|较大/.test(lb.textContent)) lb.textContent = S.font===15?'标准':(S.font<15?'较小':'较大');
  }
});

/* 时钟 */
function tick(){
  const d=new Date(); document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 30000);

/* 重置 */
function resetAll(){
  S.theme='auto'; S.bubble='#3B82F6'; S.bg=0; S.pure=false; S.font=15; S.lang='跟随系统'; S.unlock='none';
  S.multi=false; S.netDone=false; S.lines=3; S.forwardMulti=false;
  S.picked=new Set(); S.forwardPicked=new Set(); S.chatState={}; S.quote=null; S.draft=''; S.caret=0;
  S.tagGroups=[{id:'t1', name:'11', members:[]}]; S.tagSel=new Set();
  S.avtab=0; S.applytab=0; S.avatarEmoji='🙂'; S._avpick=null;
  S.nick=undefined; S.sign=undefined; S.sex=undefined; S.birth=undefined;
  D.msgs.c2=[{img:true,time:'19:19'},{text:'本周观赛活动报名开始啦！\n想参加的私聊我登记，截止到周五晚 8 点。\n\n本周观赛场次：\n\n意甲  11月9日 01:00  国际米兰 VS 科莫\n\n西甲  11月9日 04:00  马德里竞技 VS 巴塞罗那\n\n地点还是老地方，3 号观赛厅。',time:'19:19'},{me:true,text:'收到，帮我报个名'}];

/* 启动 */
applyTheme();
root('chats');

/* 深链调试：proto.html#p=groupInfo&id=c1 直达任意页面（协作评审用，经 index.html 中转同样可用） */
(function(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return;
  const kv = {}; h.split('&').forEach(x=>{const i=x.indexOf('=');kv[x.slice(0,i)]=decodeURIComponent(x.slice(i+1)||'')});
  if(kv.t==='dark'||kv.t==='light'){ S.theme=kv.t; applyTheme(); }
  if(kv.p && kv.p!=='chats'){ root('chats'); go(kv.p, kv); }
  /* #p=chat&id=c2&kbd=1 直接展开软键盘（评审/截图用） */
  if(kv.kbd && kv.p==='chat'){
    S.kbd.open = true;
    const el=document.getElementById('kbd'); if(el) el.classList.add('show');
    const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;
  }
  if(kv.debug){
    const b=document.querySelector('.pbody');
    const pb=document.querySelector('.protobar span');
    if(pb) pb.textContent = 'vw='+innerWidth+' doc='+document.documentElement.scrollWidth+' dev='+document.querySelector('.device').offsetWidth+' page='+(stack[stack.length-1].el.offsetWidth)+' pbody='+(b?b.scrollWidth:0)+' 原型设计';
  }
})();
