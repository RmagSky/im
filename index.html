<!doctype html>
<!--
  球帝带 · 交互原型统一入口（框架页）
  用途：在原型与产品基线之间切换浏览。两部分为独立 HTML，也可单独打开。
  文件对应：proto.html（原型）/ rule.html（产品基线）
  版本：v1.0.2 ｜ 版式：Stripe 文档系统
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>球帝带 · 交互原型 v1.0.2</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_fonts/outfit.css">
<style>
:root{
  --ink:#28253B; --ink-2:#554E7B; --mute:#8A8A99;
  --canvas:#FFFFFF; --soft:#FBFCFD;
  --hair:#E9E8F0;
  --accent:#5266EB; --accent-bg:#EDECFB;
  --mono:ui-monospace,"SFMono-Regular",Consolas,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Outfit,"Noto Sans SC","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",Arial,sans-serif;
  background:var(--canvas);color:var(--ink-2);display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
header{
  height:56px;flex:0 0 56px;background:var(--canvas);border-bottom:1px solid var(--hair);
  display:flex;align-items:center;gap:32px;padding:0 24px;z-index:10;
}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;align-self:center}
.brand .name{font-size:14px;font-weight:500;color:var(--ink);letter-spacing:-.1px}
.brand small{font-size:12px;color:var(--mute)}
.vnum{
  font-size:11px;color:var(--mute);cursor:pointer;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;align-self:center;
  border-bottom:1px solid transparent;transition:color 120ms var(--ease),border-color 120ms var(--ease);
}
.vnum:hover{color:var(--accent);border-color:var(--accent)}
nav{display:flex;gap:24px;flex:1;min-width:0;height:100%;overflow-x:auto;overflow-y:hidden}
nav::-webkit-scrollbar{height:0;display:none}
.tab{
  position:relative;height:100%;padding:0 2px;display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--ink-2);cursor:pointer;background:none;border:0;font-family:inherit;
  white-space:nowrap;flex:0 0 auto;transition:color 120ms var(--ease);
}
.tab:hover{color:var(--ink)}
.tab::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;
  transition:background 120ms var(--ease);
}
.tab.active{color:var(--accent)}
.tab.active::after{background:var(--accent)}
.tab .badge{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.tab.active .badge{color:var(--accent)}
.actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hint{font-size:12px;color:var(--mute);white-space:nowrap}
main{flex:1;position:relative;background:var(--soft);min-height:0}
iframe{width:100%;height:100%;border:0;display:block;background:var(--canvas)}
@media (max-width:900px){
  header{gap:20px;padding:0 16px}
  .hint{display:none}
  nav{gap:16px}
}
@media (max-width:640px){
  .brand small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <span class="name">球帝带</span>
    <small>交互原型</small>
    <span class="vnum" onclick="jump('rule')" title="点击查看版本记录">v1.0.2</span>
  </div>
  <nav id="nav"></nav>
  <div class="actions">
    <span class="hint">演示数据为 mock，不含真实后端</span>
  </div>
</header>
<main>
  <iframe id="stage" title="内容区" src="proto.html"></iframe>
</main>

<script>
/* ==================================================================
   框架页：在原型与产品基线之间切换
   深链兼容：#p=chat&id=c2 这类旧链接转发给 proto.html，评审链接不失效
   ================================================================== */
const VIEWS = [
  { key:'proto', label:'原型',   badge:'52 页', file:'proto.html' },
  { key:'rule',  label:'产品基线', badge:'规范',  file:'rule.html' }
];
let current = 'proto';

function render(){
  document.getElementById('nav').innerHTML = VIEWS.map(function(v){
    return '<button class="tab'+(v.key===current?' active':'')+'" onclick="jump(\''+v.key+'\')">'+
      v.label+' <span class="badge">'+v.badge+'</span></button>';
  }).join('');
}
function jump(key, sub){
  const v = VIEWS.find(function(x){ return x.key===key; });
  if(!v) return;
  current = key;
  document.getElementById('stage').src = v.file + (sub ? '#'+sub : '');
  render();
  try{ history.replaceState(null,'','#'+key+(sub?'/'+sub:'')); }catch(e){}
}

(function init(){
  const h = (location.hash||'').replace(/^#/,'');
  if(!h){ render(); return; }

  /* 旧深链：#p=chat&id=c2&t=dark → 原型 tab 内直达 */
  if(/(^|&)p=/.test(h)){
    document.getElementById('stage').src = 'proto.html#'+h;
    render();
    return;
  }
  /* 基线锚点：#rule/commit → 产品基线对应小节 */
  const m = h.match(/^rule(?:\/(.+))?$/);
  if(m){ jump('rule', m[1]||''); return; }
  if(VIEWS.some(function(v){ return v.key===h; })){ jump(h); return; }
  render();
})();
</script>
</body>
</html>
